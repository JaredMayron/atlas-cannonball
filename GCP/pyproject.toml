[project]
name = "financial-refresh"
version = "0.1.0"
description = "Extraction & Transformation layer that pulls raw financial data from the PocketSmith API and handles categorization for BigQuery storage."
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-api-core~=2.28.1",
    "google-cloud-bigquery~=3.20.1",
    "google-cloud-secret-manager~=2.20.1",
    "pandas~=2.2.1",
    "python-dotenv~=1.0.1",
    "requests~=2.32.4",
]

[dependency-groups]
dev = [
    "freezegun~=1.5.5",
    "pip-audit~=2.10.0",
    "pytest~=8.1.1",
    "pytest-mock~=3.12.0",
    "requests-mock~=1.11.0",
]
